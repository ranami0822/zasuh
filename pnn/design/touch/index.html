<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pnn / touch</title>
<link rel="stylesheet" href="fonts/unifontex.css">
<style>
:root {
	--font: 'UnifontEX', ui-monospace, monospace;
	--r-pill: 999px;
	--grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .4  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
[data-theme='light'] {
	--bg:#FCF6F2; --face:#F5DCD3; --ring:#F0CCC3; --bit:#F2C3B6; --card:#DDA299; --card-red:#C47F77; --press:#D2948B;
	--ink:#17181A; --soft:#4A4B4F; --mint:#A9E3DC; --shade:120 60 50; --glow:196 127 119; --grain-blend:multiply; --grain-o:.10;
}
[data-theme='dark'] {
	--bg:#1F1512; --face:#6F4332; --ring:#7F4F3D; --bit:#8D5947; --card:#B9826C; --card-red:#CC9177; --press:#AE735C;
	--ink:#F4E6DE; --soft:#DCCAC1; --mint:#8FD3CA; --shade:0 0 0; --glow:185 130 108; --grain-blend:screen; --grain-o:.05;
}
* { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
html,body { background:var(--bg); }
body {
	font-family:var(--font); font-size:16px; line-height:1.5; color:var(--ink);
	min-height:100vh; padding:28px 22px 48px; position:relative;
	-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
body::before { content:''; position:fixed; inset:0; background:var(--grain); opacity:var(--grain-o); mix-blend-mode:var(--grain-blend); pointer-events:none; }
main { position:relative; max-width:560px; margin:0 auto; display:grid; gap:26px; }
.row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }

/* ---- pressables ---- */
.p {
	position:relative; display:inline-flex; align-items:center; justify-content:center;
	font:inherit; border:0; cursor:pointer; touch-action:manipulation; color:#17181A;
	border-radius:var(--r-pill); background:var(--card);
	box-shadow:0 6px 18px rgb(var(--glow)/.5);
	transition:transform var(--in,.12s) cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, background-color .12s;
	will-change:transform;
}
.p .f { display:block; pointer-events:none; }
.p.down { transform:scale(var(--dx),var(--dy)); background:var(--press); box-shadow:0 1px 4px rgb(var(--glow)/.35), inset 0 3px 8px rgb(var(--shade)/.28); }
.p.deep { transform:scale(var(--sx),var(--sy)); transition:transform var(--sink,.5s) cubic-bezier(.2,.6,.2,1), box-shadow .3s ease, background-color .12s; box-shadow:0 0 2px rgb(var(--glow)/.3), inset 0 5px 12px rgb(var(--shade)/.34); }
.p.rel { transition:none; }
.p.shake .f { animation:tr .09s steps(1) infinite; }
@keyframes tr { 0%{translate:var(--tr) 0} 25%{translate:0 var(--tr)} 50%{translate:calc(var(--tr)*-1) 0} 75%{translate:0 calc(var(--tr)*-1)} }

.btn { padding:14px 30px; }
.btn.soft { background:var(--ring); color:var(--ink); box-shadow:none; }
.btn.soft.down, .btn.soft.deep { background:var(--bit); }
.btn.mint { background:var(--mint); box-shadow:0 6px 18px rgb(120 190 180/.5); }
.btn.mint.down, .btn.mint.deep { background:var(--mint); filter:brightness(.92); }
.chip { padding:8px 20px; background:var(--ring); color:var(--ink); box-shadow:none; }
.chip.down,.chip.deep { background:var(--bit); }
.chip.on { background:var(--card); color:#17181A; }
.heart { width:64px; height:64px; font-size:32px; background:var(--ring); color:var(--ink); box-shadow:0 6px 18px rgb(var(--shade)/.18); }
.heart.liked { color:var(--card-red); background:var(--face); }
.heart.liked.down,.heart.liked.deep { background:var(--ring); }
.big { display:block; width:100%; text-align:left; border-radius:28px; padding:22px; background:var(--face); color:var(--ink); box-shadow:0 8px 30px rgb(var(--shade)/.18); }
.big.down,.big.deep { background:var(--ring); }
.big .t { font-size:32px; line-height:1.25; }
.big .s { color:var(--soft); margin-top:8px; }

/* ---- top bar: modes ---- */
.bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.mode { padding:8px 18px; background:var(--ring); color:var(--ink); box-shadow:none; }
.mode.on { background:var(--card); color:#17181A; }
.sp { flex:1; }
@media (prefers-reduced-motion: reduce) { .p.shake .f { animation:none; } }
</style>
</head>
<body data-theme="light">
<main>
	<div class="bar">
		<button class="p mode on" data-v="a" data-k="1"><span class="f">ン</span></button>
		<button class="p mode" data-v="b" data-k="1"><span class="f">ンっ…</span></button>
		<button class="p mode" data-v="c" data-k="1"><span class="f">ぐっ</span></button>
		<span class="sp"></span>
		<button class="p mode" id="buru" data-k="1"><span class="f">ぶる</span></button>
		<button class="p mode" id="theme" data-k="1"><span class="f">☾</span></button>
	</div>

	<div class="row">
		<button class="p btn" data-k="1"><span class="f">公開</span></button>
		<button class="p btn soft" data-k="1"><span class="f">下書き</span></button>
		<button class="p btn mint" data-k="1"><span class="f">保存</span></button>
	</div>

	<div class="row">
		<button class="p chip on" data-k="1.1"><span class="f">見出し</span></button>
		<button class="p chip" data-k="1.1"><span class="f">太字</span></button>
		<button class="p chip" data-k="1.1"><span class="f">引用</span></button>
		<button class="p chip" data-k="1.1"><span class="f">ルビ</span></button>
	</div>

	<div class="row">
		<button class="p heart" data-k="1.3" id="h1"><span class="f">♡</span></button>
		<button class="p heart" data-k="1.3" id="h2"><span class="f">♡</span></button>
		<button class="p heart" data-k="1.3" id="h3"><span class="f">♡</span></button>
	</div>

	<button class="p big" data-k=".22"><span class="f"><div class="t">夜中にしか書けない</div><div class="s">恥ずかしいのに、消したくない。</div></span></button>
</main>

<script>
(() => {
	const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
	// 動きの3案。down/deep は押したときの [横, 縦] の倍率。rel は離したときのばね
	const V = {
		a: { down:[.94,.90], deep:[.91,.86], inMs:120, sinkAt:140, sinkMs:520, tremble:0,  vib:[6],
		     rel:[[.45,'scale(1.03,.98)'],[1,'scale(1,1)']], dur:360 },
		b: { down:[.95,.89], deep:[.92,.83], inMs:110, sinkAt:160, sinkMs:700, tremble:.7, vib:[8,30,5],
		     rel:[[.30,'scale(1.06,.95)'],[.55,'scale(.985,1.02)'],[.78,'scale(1.015,.99)'],[1,'scale(1,1)']], dur:640 },
		c: { down:[.92,.92], deep:[.89,.89], inMs:260, sinkAt:300, sinkMs:500, tremble:0,  vib:[14],
		     rel:[[1,'scale(1,1)']], dur:420 },
	};
	let cur = 'a', buru = false;
	const k = el => +el.dataset.k || 1;
	const sc = (x, el) => 1 - (1 - x) * k(el);
	const vib = pat => { if (buru && navigator.vibrate) { try { navigator.vibrate(pat); } catch (e) {} } };

	function down(el) {
		el.getAnimations().forEach(a => a.cancel());
		clearTimeout(el._t);
		const v = V[cur];
		el.classList.remove('rel', 'deep', 'shake');
		el.style.setProperty('--in', (reduced ? 80 : v.inMs) + 'ms');
		const d = reduced ? [.97, .97] : v.down, p = reduced ? [.97, .97] : v.deep;
		el.style.setProperty('--dx', sc(d[0], el)); el.style.setProperty('--dy', sc(d[1], el));
		el.style.setProperty('--sx', sc(p[0], el)); el.style.setProperty('--sy', sc(p[1], el));
		el.style.setProperty('--sink', v.sinkMs + 'ms');
		el.classList.add('down');
		if (reduced) return;
		el._t = setTimeout(() => {
			if (!el.classList.contains('down')) return;
			el.classList.add('deep');
			if (v.tremble) { el.style.setProperty('--tr', v.tremble + 'px'); el.classList.add('shake'); vib([4, 20, 4, 20, 4]); }
		}, v.sinkAt);
		vib(v.vib);
	}
	function up(el, fire) {
		clearTimeout(el._t);
		if (!el.classList.contains('down')) return;
		const from = getComputedStyle(el).transform;
		el.classList.add('rel');
		el.classList.remove('down', 'deep', 'shake');
		if (!reduced) {
			const v = V[cur];
			const frames = [{ transform: from === 'none' ? 'scale(1)' : from, offset: 0 }];
			v.rel.forEach(([o, s]) => {
				const m = s.match(/scale\(([\d.]+),([\d.]+)\)/);
				frames.push({ transform: `scale(${1 + (+m[1] - 1) * k(el)},${1 + (+m[2] - 1) * k(el)})`, offset: o });
			});
			const a = el.animate(frames, { duration: v.dur, easing: 'ease-out' });
			a.onfinish = a.oncancel = () => el.classList.remove('rel');
		} else el.classList.remove('rel');
		if (fire) act(el);
	}
	function act(el) {
		if (el.dataset.v) { cur = el.dataset.v; document.querySelectorAll('.mode[data-v]').forEach(m => m.classList.toggle('on', m === el)); }
		else if (el.id === 'buru') { buru = !buru; el.classList.toggle('on', buru); if (buru) vib(12); }
		else if (el.id === 'theme') { const d = document.body.dataset.theme === 'light'; document.body.dataset.theme = d ? 'dark' : 'light'; el.firstChild.textContent = d ? '☀' : '☾'; }
		else if (el.classList.contains('heart')) { const on = el.classList.toggle('liked'); el.firstChild.textContent = on ? '❤' : '♡'; }
		else if (el.classList.contains('chip')) { el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)); }
	}
	document.querySelectorAll('.p').forEach(el => {
		el.addEventListener('pointerdown', e => { if (e.button > 0) return; el.setPointerCapture(e.pointerId); down(el); });
		el.addEventListener('pointerup', e => { const r = el.getBoundingClientRect(); up(el, e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom); });
		el.addEventListener('pointercancel', () => up(el, false));
		el.addEventListener('contextmenu', e => e.preventDefault());
		el.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); down(el); } });
		el.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') up(el, true); });
	});
	// 暗い部屋の設定に合わせる
	if (matchMedia('(prefers-color-scheme: dark)').matches) { document.body.dataset.theme = 'dark'; document.getElementById('theme').firstChild.textContent = '☀'; }
})();
</script>
</body>
</html>
