<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pnn / palette B</title>
<link rel="stylesheet" href="../static/fonts/unifontex.css">
<style>

/* ---- tokens (proposal B: user palette) ---- */
.theme {
	--font: 'UnifontEX', ui-monospace, monospace;
	--bg: #FCF6F2; --face: #F5DCD3; --ring: #F0CCC3; --bit1: #F2C3B6; --bit2: #EDC0B2; --hi: #FAEAE3;
	--card: #DDA299; --card-red: #C47F77; --press: #D2948B;
	--gray: #9A9BA0; --gray-lt: #C4C5C8; --gray-dp: #6B6C71;
	--ink: #17181A; --ink-soft: #4A4B4F;
	--mint: #A9E3DC; --mint-lt: #DDF1EC;
	--r-pill: 999px; --r-box: 0;
	--shade: 120 60 50; --glow: 196 127 119;
	--grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .4  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
	/* aliases used by the scaffold */
	--ground: var(--bg); --surface: var(--face); --sunk: var(--ring);
	--pink-300: var(--card); --pink-400: var(--card); --pink-500: var(--card); --pink-600: var(--card-red);
	--almond: var(--mint); --almond-deep: var(--gray-dp);
	--gray-50: var(--hi); --gray-100: var(--gray-lt); --gray-500: var(--gray); --gray-900: var(--ink);
	--skin-100: var(--hi); --skin-200: var(--face); --skin-300: var(--bit1);
	--ink-soft: #4A4B4F;
}
.theme[data-theme='dark'] { display: none; }
.pair { grid-template-columns: 1fr !important; }
/* ---- preview scaffold ---- */
* { box-sizing: border-box; margin: 0; }
body { background: #888; font-family: var(--font, 'UnifontEX', monospace); font-size: 16px; line-height: 1.5; }
.pair { display: grid; grid-template-columns: 1fr 1fr; }
@media (max-width: 900px) { .pair { grid-template-columns: 1fr; } }

.theme {
	font-family: var(--font);
	background: var(--ground);
	color: var(--ink);
	padding: 32px 28px 40px;
	display: grid;
	gap: 28px;
	align-content: start;
	min-height: 100vh;
	position: relative;
}
.theme::before {
	content: '';
	position: absolute; inset: 0;
	background: var(--grain);
	opacity: .10;
	mix-blend-mode: multiply;
	pointer-events: none;
}
.theme[data-theme='dark']::before { mix-blend-mode: screen; opacity: .07; }
.theme > * { position: relative; }

h1 { font-size: 48px; line-height: 1.1; font-weight: 400; }
h2 { font-size: 32px; line-height: 1.2; font-weight: 400; }

/* swatches: faces only, no labels, no lines */
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { width: 56px; height: 56px; border-radius: var(--r-pill); box-shadow: 0 6px 16px rgb(var(--shade) / .22); }

/* hero: pink in front, with gradient + coloured shadow */
.hero {
	padding: 28px;
	border-radius: var(--r-pill);
	background: linear-gradient(135deg, var(--card), var(--card-red));
	color: var(--ink);
	box-shadow: 0 14px 40px rgb(var(--glow) / .45), 0 0 0 0 transparent;
	display: grid; gap: 6px;
	justify-items: center; text-align: center;
}

/* surface card: face only */
.card {
	background: var(--surface);
	border-radius: 28px;
	padding: 22px;
	display: grid; gap: 14px;
	box-shadow: 0 8px 30px rgb(var(--shade) / .18);
}

/* pill controls */
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn {
	font: inherit; font-size: 16px;
	border: 0; cursor: pointer;
	padding: 12px 26px;
	border-radius: var(--r-pill);
	background: var(--pink-500);
	color: var(--gray-900);
	box-shadow: 0 6px 18px rgb(var(--glow) / .5);
	transition: transform .12s, box-shadow .12s;
}
.btn:hover { transform: translateY(-1px) scale(1.03); box-shadow: 0 10px 26px rgb(var(--glow) / .6); }
.btn:active { background: var(--press); transform: scale(.94); box-shadow: 0 2px 8px rgb(var(--glow) / .5); }
.btn.soft { background: var(--sunk); color: var(--ink); box-shadow: none; }
.btn.accent { background: var(--mint); box-shadow: 0 6px 18px rgb(120 190 180 / .5); }
.input {
	font: inherit; font-size: 16px;
	border: 0; outline: 0;
	padding: 12px 22px;
	border-radius: var(--r-pill);
	background: var(--sunk);
	color: var(--ink);
	box-shadow: inset 0 3px 8px rgb(var(--shade) / .16);
	min-width: 220px;
}
.input:focus { box-shadow: inset 0 3px 8px rgb(var(--shade) / .16), 0 0 0 4px rgb(var(--glow) / .45); }

/* decoration bar: a thin horizontally scrolling strip of pills */
.bar {
	display: flex; gap: 8px; overflow-x: auto;
	padding: 8px; border-radius: var(--r-pill);
	background: var(--surface);
	box-shadow: 0 6px 20px rgb(var(--shade) / .16);
	scrollbar-width: none;
}
.bar::-webkit-scrollbar { display: none; }
.chip {
	flex: none; font: inherit; font-size: 16px; border: 0; cursor: pointer;
	padding: 6px 16px; border-radius: var(--r-pill);
	background: var(--sunk); color: var(--ink);
}
.chip.on { background: var(--pink-400); color: var(--gray-900); }

/* writing surface: inline-formatted, no divider */
.page { display: grid; gap: 10px; }
.page .t { font-size: 32px; line-height: 1.25; }
.page .b { color: var(--ink); }
.page .b strong { background: linear-gradient(transparent 55%, rgb(var(--glow) / .45) 55%); font-weight: 400; }
.page .b em { font-style: normal; color: var(--almond-deep); }
.dim { color: var(--ink-soft); }

/* dialog / macro layout: right angles, shadow all around */
.dialog {
	background: var(--surface);
	border-radius: var(--r-box);
	padding: 24px;
	display: grid; gap: 16px;
	box-shadow: 0 0 60px rgb(var(--shade) / .35), 0 0 0 0 transparent;
}
.dialog .row { justify-content: flex-end; }

/* tiny state bubbles */
.dots { display: flex; gap: 8px; align-items: center; }
.dot { width: 14px; height: 14px; border-radius: 50%; }
.dot.p { background: var(--pink-500); box-shadow: 0 0 12px rgb(var(--glow) / .7); }
.dot.a { background: var(--almond); }
.dot.g { background: var(--gray-500); }
</style>
</head>
<body>
<div class="pair">
	<!-- same markup twice: light, dark -->
	<main class="theme" data-theme="light" id="light">
		<h1>はだいろ ピンク</h1>

		<div class="swatches">
			<span class="sw" style="background:var(--skin-100)"></span>
			<span class="sw" style="background:var(--skin-200)"></span>
			<span class="sw" style="background:var(--skin-300)"></span>
			<span class="sw" style="background:var(--pink-300)"></span>
			<span class="sw" style="background:var(--pink-400)"></span>
			<span class="sw" style="background:var(--pink-500)"></span>
			<span class="sw" style="background:var(--pink-600)"></span>
			<span class="sw" style="background:var(--almond)"></span>
			<span class="sw" style="background:var(--almond-deep)"></span>
			<span class="sw" style="background:var(--gray-100)"></span>
			<span class="sw" style="background:var(--gray-500)"></span>
			<span class="sw" style="background:var(--gray-900)"></span>
		</div>

		<div class="hero">
			<h2>きょうのほんね</h2>
			<span>痛くても、そのまま。</span>
		</div>

		<div class="card">
			<div class="bar">
				<button class="chip on">見出し</button><button class="chip">太字</button><button class="chip">傾き</button><button class="chip">引用</button><button class="chip">箇条</button><button class="chip">区切り</button><button class="chip">ルビ</button><button class="chip">空行</button>
			</div>
			<div class="page">
				<div class="t">夜中にしか書けない</div>
				<div class="b">恥ずかしいのに、<strong>消したくない</strong>。誰にも見せないつもりで書いたことが、いちばん<em>本当</em>だった。</div>
				<div class="dim">いま 3 件 ・ 下書き</div>
			</div>
			<div class="row">
				<input class="input" value="ことば">
				<button class="btn">公開</button>
				<button class="btn soft">下書き</button>
				<button class="btn accent">保存</button>
			</div>
			<div class="dots"><span class="dot p"></span><span class="dot a"></span><span class="dot g"></span></div>
		</div>

		<div class="dialog">
			<h2>名乗る？</h2>
			<span class="dim">ひっこめるのも、いつでも。</span>
			<div class="row"><button class="btn soft">まだ</button><button class="btn">名乗る</button></div>
		</div>
	</main>

	<main class="theme" data-theme="dark" id="dark">
		<h1>はだいろ ピンク</h1>

		<div class="swatches">
			<span class="sw" style="background:var(--sunk)"></span>
			<span class="sw" style="background:var(--ground)"></span>
			<span class="sw" style="background:var(--surface)"></span>
			<span class="sw" style="background:var(--pink-300)"></span>
			<span class="sw" style="background:var(--pink-400)"></span>
			<span class="sw" style="background:var(--pink-500)"></span>
			<span class="sw" style="background:var(--pink-600)"></span>
			<span class="sw" style="background:var(--almond)"></span>
			<span class="sw" style="background:var(--almond-deep)"></span>
			<span class="sw" style="background:var(--gray-100)"></span>
			<span class="sw" style="background:var(--gray-500)"></span>
			<span class="sw" style="background:var(--gray-900)"></span>
		</div>

		<div class="hero">
			<h2>きょうのほんね</h2>
			<span>痛くても、そのまま。</span>
		</div>

		<div class="card">
			<div class="bar">
				<button class="chip on">見出し</button><button class="chip">太字</button><button class="chip">傾き</button><button class="chip">引用</button><button class="chip">箇条</button><button class="chip">区切り</button><button class="chip">ルビ</button><button class="chip">空行</button>
			</div>
			<div class="page">
				<div class="t">夜中にしか書けない</div>
				<div class="b">恥ずかしいのに、<strong>消したくない</strong>。誰にも見せないつもりで書いたことが、いちばん<em>本当</em>だった。</div>
				<div class="dim">いま 3 件 ・ 下書き</div>
			</div>
			<div class="row">
				<input class="input" value="ことば">
				<button class="btn">公開</button>
				<button class="btn soft">下書き</button>
				<button class="btn accent">保存</button>
			</div>
			<div class="dots"><span class="dot p"></span><span class="dot a"></span><span class="dot g"></span></div>
		</div>

		<div class="dialog">
			<h2>名乗る？</h2>
			<span class="dim">ひっこめるのも、いつでも。</span>
			<div class="row"><button class="btn soft">まだ</button><button class="btn">名乗る</button></div>
		</div>
	</main>
</div>
</body>
</html>
